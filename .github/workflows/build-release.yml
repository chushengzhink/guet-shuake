name: build-release

on:
  # 只在手动触发时构建：本地构建并验证过的签名包，不希望被 CI 产物覆盖
  # （想改成打 tag 自动出包，把下面注释的 push 段打开即可）
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v），例如 1.0.0"
        required: true
        default: "1.0.0"
      publish:
        description: "构建完成后创建/更新 Release"
        type: boolean
        default: false
  # push:
  #   tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 正式发布必须配置受信任签名
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.CODESIGN_PFX_BASE64 }}
        run: |
          if (-not $env:PFX_B64) {
            throw '正式发布需要配置代码签名证书，禁止回退自签名。参见 packaging/SIGNING.md'
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m playwright install chromium

      - name: 跑测试
        run: python -m unittest discover -s tests -q

      - name: 准备内置浏览器
        shell: pwsh
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'ms-playwright'
          $src = Get-ChildItem $root -Directory -Filter 'chromium-*' |
                 Sort-Object Name -Descending | Select-Object -First 1
          New-Item -ItemType Directory -Force 'packaging\browsers' | Out-Null
          Copy-Item $src.FullName (Join-Path 'packaging\browsers' $src.Name) -Recurse
          Write-Host "内置浏览器：$($src.Name)"

      - name: 解析版本号
        id: ver
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $v = $env:RELEASE_VERSION
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw '版本号必须为 x.y.z' }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 构建 full + lite（有证书则正式签名）
        shell: powershell
        env:
          PFX_B64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          GUET_CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
          RELEASE_VERSION: ${{ steps.ver.outputs.value }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
        run: |
          $ErrorActionPreference = 'Stop'
          $certPath = Join-Path $env:RUNNER_TEMP 'guet-codesign.pfx'
          $extra = @{
            Variant  = 'both'
            Version  = $env:RELEASE_VERSION
          }
          try {
            if ($env:PFX_B64) {
              [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:PFX_B64))
              $extra.Sign = $true
              $extra.SignMode = 'pfx'
              $extra.PfxPath = $certPath
            }
            if ($env:PUBLISH_RELEASE -eq 'true') { $extra.Release = $true }
            & packaging\build.ps1 @extra
          } finally {
            if (Test-Path -LiteralPath $certPath) { Remove-Item -LiteralPath $certPath -Force }
            Remove-Item Env:GUET_CODESIGN_PASSWORD -ErrorAction SilentlyContinue
            Remove-Item Env:PFX_B64 -ErrorAction SilentlyContinue
          }

      - name: 保存构建产物（无证书时仅供开发测试）
        uses: actions/upload-artifact@v4
        with:
          name: GuetShuake-${{ steps.ver.outputs.value }}
          path: packaging/output/*
          if-no-files-found: error

      - name: 收集产物
        shell: pwsh
        run: |
          Get-ChildItem packaging\output\*.exe | Select-Object Name, Length | Format-Table
          foreach ($f in Get-ChildItem packaging\output\*.exe) {
            "{0}  {1:N1} MB" -f $f.Name, ($f.Length / 1MB)
          }

      - name: 发布 Release
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.value }}
          files: |
            packaging/output/*.exe
            packaging/output/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## 下载哪个版本

            | 版本 | 适合谁 |
            |---|---|
            | **full**（体积大） | 推荐：内置浏览器内核，装完即用，不依赖系统装了什么 |
            | **lite**（体积小） | 电脑里有 Microsoft Edge（Windows 10/11 默认自带） |

            两个版本功能一致。卸载不会删除账号、登录状态和刷课进度（保存在 `%LOCALAPPDATA%\GuetShuake`）。
